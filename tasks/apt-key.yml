---
# Verifies and installs one key of _apt_key. deb822_repository fetches a
# signed_by URL itself and cannot check a fingerprint, so the key is fetched
# into a private temporary directory first. It is only installed when it holds
# exactly one key and the fingerprint of that key is the id listed in
# _apt_key. The key is installed where deb822_repository would have stored it,
# so installs from earlier versions of this role are updated in place. The
# key has to be ASCII armored, as the file is named .asc; apt rejects it
# otherwise.
# _perforce_apt_key is a pair of the _apt_key entry and its _apt_repository entry.
- name: apt-key | Create temporary directory
  ansible.builtin.tempfile:
    state: directory
    prefix: apt-key-
  register: _perforce_apt_key_dir
  changed_when: false

- name: apt-key | Verify and install key
  block:
    - name: apt-key | Download key
      ansible.builtin.get_url:
        url: "{{ _perforce_apt_key[0].url }}"
        dest: "{{ _perforce_apt_key_dir.path }}/key"
        mode: "0600"
      changed_when: false
      register: _perforce_apt_key_download
      until: _perforce_apt_key_download is succeeded

    - name: apt-key | Read key fingerprints
      ansible.builtin.command:
        argv:
          - gpg
          - --show-keys
          - --with-colons
          - --with-fingerprint
          - "{{ _perforce_apt_key_dir.path }}/key"
      environment:
        GNUPGHOME: "{{ _perforce_apt_key_dir.path }}"
      changed_when: false
      register: _perforce_apt_key_info

    # In the colon listing the first fpr line is the fingerprint of the
    # primary key, the ones after it belong to subkeys.
    - name: apt-key | Verify key fingerprint
      ansible.builtin.assert:
        that:
          - _perforce_apt_key_info.stdout_lines | select('match', '^(pub|sec):') | list | length == 1
          - (_perforce_apt_key_info.stdout_lines | select('match', '^fpr:') | first).split(':')[9] | upper == _perforce_apt_key[0].id | upper
        fail_msg: >-
          The key downloaded from {{ _perforce_apt_key[0].url }} is not a single
          key with fingerprint {{ _perforce_apt_key[0].id }}, refusing to trust it.
        quiet: true

    - name: apt-key | Install key
      ansible.builtin.copy:
        src: "{{ _perforce_apt_key_dir.path }}/key"
        dest: "/etc/apt/keyrings/{{ _perforce_apt_key[1].filename | regex_replace('[^A-Za-z0-9_-]+', '_') }}.asc"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
  always:
    - name: apt-key | Remove temporary directory
      ansible.builtin.file:
        path: "{{ _perforce_apt_key_dir.path }}"
        state: absent
      changed_when: false
